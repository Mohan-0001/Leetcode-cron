name: LeetCode High-Frequency Sync

on:
  schedule:
    # Runs every 6 minutes
    - cron: '*/25 * * * *'
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger 30-User Batch
        run: |
          curl -L -X GET "https://alfreda-unreasoned-lory.ngrok-free.dev/api/system/sync-batch?auth=${{ secrets.SYNC_SECRET }}&limit=376" \
          -H "ngrok-skip-browser-warning: true"